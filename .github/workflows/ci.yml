name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway test credentials for the CI container, not secrets
          POSTGRES_USER: gototalk
          POSTGRES_PASSWORD: gototalk_ci
          POSTGRES_DB: gototalk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gototalk -d gototalk_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # No .env file in CI: the API config and globalSetup read variables from the process
      DATABASE_URL: postgres://gototalk:gototalk_ci@localhost:5432/gototalk_test
      TEST_DATABASE_URL: postgres://gototalk:gototalk_ci@localhost:5432/gototalk_test
      STT_PROVIDER: fake
      LLM_PROVIDER: fake

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
